<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="nerd-fonts-installer — Nerd Fonts, installed the boring way">
  <defs>
    <linearGradient id="ramp" x1="0" y1="0" x2="1200" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FF5FAF"/>
      <stop offset="0.34" stop-color="#C75CFF"/>
      <stop offset="0.68" stop-color="#5BA8FF"/>
      <stop offset="1" stop-color="#46E5E0"/>
    </linearGradient>
    <linearGradient id="badge" x1="0" y1="0" x2="160" y2="160" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#7C3AED"/>
      <stop offset="1" stop-color="#2563EB"/>
    </linearGradient>
    <linearGradient id="glyph" x1="48" y1="34" x2="112" y2="98" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#C7D2FE"/>
    </linearGradient>
    <radialGradient id="glow1" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#C75CFF" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#C75CFF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#46E5E0" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#46E5E0" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="#0B0B12"/>
  <ellipse cx="180" cy="80" rx="520" ry="420" fill="url(#glow1)"/>
  <ellipse cx="1080" cy="600" rx="500" ry="400" fill="url(#glow2)"/>
  <rect y="0" width="1200" height="6" fill="url(#ramp)"/>

  <!-- logo badge -->
  <g transform="translate(88, 96) scale(0.82)">
    <rect x="8" y="8" width="144" height="144" rx="34" fill="url(#badge)"/>
    <rect x="8.5" y="8.5" width="143" height="143" rx="33.5" fill="none" stroke="#FFFFFF" stroke-opacity="0.18"/>
    <path d="M80 30 L112 96 H96 L89.5 81 H70.5 L64 96 H48 L80 30 Z M80 53 L74 68 H86 L80 53 Z" fill="url(#glyph)"/>
    <g stroke="#FFFFFF" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <path d="M80 104 V128"/>
      <path d="M66 117 L80 131 L94 117"/>
    </g>
  </g>

  <text x="238" y="168" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="34" fill="#A2A2BE" letter-spacing="1">nerd-fonts-installer</text>

  <text x="88" y="330" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="76" font-weight="800" fill="#EDEDF7" letter-spacing="-2">Nerd Fonts,</text>
  <text x="88" y="416" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="76" font-weight="800" fill="url(#ramp)" letter-spacing="-2">installed the boring way.</text>

  <text x="88" y="474" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="28" fill="#A2A2BE">One config file. One command. Every machine.</text>

  <!-- terminal strip -->
  <rect x="88" y="512" width="1024" height="66" rx="14" fill="#15142E" stroke="#2C2A44"/>
  <circle cx="118" cy="545" r="6" fill="#FF5F57"/>
  <circle cx="139" cy="545" r="6" fill="#FEBC2E"/>
  <circle cx="160" cy="545" r="6" fill="#28C840"/>
  <text x="192" y="553" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="23" fill="#EDEDF7"><tspan fill="#FF5FAF">$</tspan> nerd-fonts-installer <tspan fill="#46E5E0">--interactive</tspan></text>
</svg>
